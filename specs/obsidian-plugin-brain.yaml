# Brainstein spec v3
# Obsidian Plugin Brain: architecting, building, reviewing, and shipping Obsidian plugins across all scopes.
spec_version: 3
slug: "obsidian-plugin-brain"
title: "Obsidian Plugin Creator"
domain: "Architecting, building, styling, optimizing, testing, auditing, and shipping Obsidian plugins across all plugin scopes: core commands, multi-pane dashboards and Bases views, 2D and 3D WebGL visuals and canvases, CodeMirror 6 editor extensions, Markdown processors, vault and MetadataCache engines, mobile compatibility, and Community Store releases."
buyer: "Indie makers, developer-creators, tool builders, and AI engineering teams who build vault-specific or Community Store Obsidian plugins and need source-cited official APIs, review rules, and scope-specific architecture patterns instead of outdated forum folklore."
owner: "Daniel Agrici"
repo_url: "https://github.com/AgriciDaniel/obsidian-plugin-creator-public"
license_name: "Apache-2.0"
research_refresh_cadence: "monthly for docs.obsidian.md, obsidian.md/changelog, obsidian-api typings, eslint-plugin rules, and obsidian-releases submission policies; on-release for major Obsidian desktop and mobile updates"
workflows:
  - "Discover, brief, design, generate local plugin source artifacts, implement, verify, and maintain a product-specific Obsidian plugin"
  - "Plugin scope classification and architecture selection across commands, custom views, Bases views, 2D and 3D visuals, CodeMirror 6 extensions, Markdown processors, and vault indexers"
  - "Lifecycle, Component ownership, and cleanup design for onload, onunload, registered events, intervals, and deferred workspace leaves"
  - "Dashboard, ItemView, Bases view, modal, suggest, and settings UX engineering with theme-native Obsidian CSS variables"
  - "2D Canvas, SVG, and 3D WebGL or Three.js visual engineering with ResizeObserver sizing, tab-visibility render throttling, and GPU disposal"
  - "Editor and Markdown pipeline engineering across Source mode, Live Preview (CodeMirror 6), and Reading view post-processors"
  - "Vault, FileManager, MetadataCache, atomic background edits, and deep subpath or URI interlinking"
  - "Cross-platform mobile hardening (iOS and Android), startup performance profiling, Sync-safe storage, and XSS security review"
  - "Pre-submission static review against obsidianmd/eslint-plugin, obsidian-releases bot checks, versions.json parity, and GitHub Actions release packaging"
raw_sources:
  - "Operator-supplied Obsidian plugin repositories, manifest.json, versions.json, package.json, esbuild or Vite configs, TypeScript source files, styles.css, and startup or heap profile traces"
enrichment_sources:
  - "docs.obsidian.md official developer documentation (Plugins, Views, Editor, Vault, Events, UI, Theme, Submission guidelines)"
  - "github.com/obsidianmd/obsidian-api official TypeScript API definitions (obsidian.d.ts)"
  - "github.com/obsidianmd/obsidian-releases plugin submission rules, bot checks, and community registry"
  - "github.com/obsidianmd/eslint-plugin official ESLint rules for Obsidian plugin review"
  - "github.com/obsidianmd/obsidian-sample-plugin canonical starter configuration and build pipeline"
  - "obsidian.md/changelog official release notes for current API additions such as Deferred Views, Bases, Web Viewer, CLI, and SecretStorage"
  - "jsoncanvas.org official JSON Canvas 1.0 specification"
  - "codemirror.net/docs official CodeMirror 6 system guide and reference manual"
  - "threejs.org/docs official WebGLRenderer lifecycle, disposal, and context management documentation"
deliverables:
  - "Source-bound creator playbooks, eight compiled starter archetypes, product contracts, and artifact hash receipts"
  - "Plugin scope and architecture decision matrix mapping product goals to Obsidian API surfaces"
  - "Community Store submission and eslint-plugin readiness scorecard"
  - "Lifecycle, memory-leak, and deferred-view audit checklist"
  - "Visuals, dashboards, Bases, and 3D WebGL engineering runbook"
  - "CodeMirror 6 Live Preview and Reading view parity guide"
  - "Mobile compatibility, Sync storage budget, and security hardening report"
refusal_rules:
  - "No unsourced Obsidian API, submission policy, or version claims"
  - "No guidance that violates official Obsidian Plugin Guidelines such as calling detachLeavesOfType in onunload or injecting unsanitized innerHTML"
  - "No recommendation to bundle duplicate @codemirror/* or obsidian runtime modules into main.js"
  - "No credentials, API keys, sync tokens, or private vault content in repo artifacts or sample fixtures"
  - "No account, registry, or host-system mutation in V1"
  - "No irreversible recommendation without owner, confidence, source, and rollback note"
safety_risks:
  - "Stale Obsidian API or submission review claims due to new desktop, mobile, or Bases releases"
  - "DOM XSS vulnerabilities when rendering untrusted Markdown, frontmatter, JSONL traces, or external responses via innerHTML"
  - "Mobile crashes on iOS and Android caused by unguarded Node.js or Electron imports when isDesktopOnly is false"
  - "Sync traffic, conflicts, and storage constraints when large derived caches are stored with plugin settings"
  - "Memory leaks, detached DOM trees, and background WebGL GPU drain when views close or hide without disposal"
  - "Secret leakage when storing plaintext API keys inside git-tracked vault plugin data files"
playbook_steps:
  - "Capture dated primary sources from docs.obsidian.md, obsidian-api, eslint-plugin, and obsidian-releases before drafting claims"
  - "Classify the target plugin across the eight Obsidian plugin scopes and select the minimal required API surfaces"
  - "Run static importer and synthesis checks against manifest.json, bundler externals, lifecycle hooks, DOM sinks, and mobile flags"
  - "Verify UI, CSS variable theming, keyboard accessibility, and Source/Live Preview/Reading mode parity"
  - "Regenerate the deterministic sample vault and verify SHA-256 parity"
  - "Pass the 51-item Brainstein SSS+ audit before packaging a market-ready release"
audit_focus:
  - "source-ledger freshness against docs.obsidian.md, obsidian-api, eslint-plugin, and obsidian.md/changelog"
  - "submission and security rules traced directly to obsidian-releases guidelines and eslint-plugin checks"
  - "bundler externalization and CodeMirror 6 claims traced to obsidian-sample-plugin and codemirror.net docs"
  - "deliverable citation coverage across all eight plugin scopes"
next_action_signals:
  - "stale refresh_due > 30 days"
  - "new Obsidian desktop or mobile minor release introducing plugin APIs not yet captured in canon"
  - "open critical audit failure in Brainstein scorecard"
  - "missing schema, fixture, or rule coverage in obsidian_plugin_brain adapter"
claim_ledger_policy: "single-source marked; second source preferred"
second_source_policy: "required for market, current, comparative, numeric, and high-stakes claims"
source_refresh_days: 30
confidence_policy: "evidence-based, practitioner, contested, folklore"
canon_seed_count: 16
canon_targets:
  - "Plugin lifecycle, Component ownership, and cleanup discipline"
  - "Workspace leaves, custom ItemView dashboards, and deferred views"
  - "Obsidian Bases API, native dashboards, and query surfaces"
  - "Modals, suggest interfaces, menus, settings tabs, and SecretStorage"
  - "Design system, CSS variables, themes, icons, and accessibility"
  - "2D graphs, JSON Canvas 1.0, SVG diagrams, and interactive visualizations"
  - "3D WebGL, Three.js, React Three Fiber, and spatial codex views"
  - "CodeMirror 6 architecture, StateFields, ViewPlugins, and Live Preview"
  - "Markdown post-processors, codeblock widgets, and Reading view parity"
  - "Vault API, FileManager, atomic edits, and DataAdapter boundaries"
  - "MetadataCache, link resolution, subpath deep-linking, and Obsidian URI"
  - "UI frameworks in plugins: Vanilla DOM, React, Svelte, and Vue"
  - "Build toolchains, esbuild, Vite dual-target, hot-reload, and testing"
  - "Mobile compatibility, startup performance, and memory profiling"
  - "Security, XSS prevention, Sync storage limits, and network disclosure"
  - "Community Store submission, eslint-plugin review gates, BRAT, and release CI"
canon_fold_targets:
  - "Plugin lifecycle, Component ownership, and cleanup discipline"
  - "Workspace leaves, custom ItemView dashboards, and deferred views"
  - "Obsidian Bases API, native dashboards, and query surfaces"
  - "Modals, suggest interfaces, menus, settings tabs, and SecretStorage"
  - "Design system, CSS variables, themes, icons, and accessibility"
  - "2D graphs, JSON Canvas 1.0, SVG diagrams, and interactive visualizations"
  - "3D WebGL, Three.js, React Three Fiber, and spatial codex views"
  - "CodeMirror 6 architecture, StateFields, ViewPlugins, and Live Preview"
  - "Markdown post-processors, codeblock widgets, and Reading view parity"
  - "Vault API, FileManager, atomic edits, and DataAdapter boundaries"
  - "MetadataCache, link resolution, subpath deep-linking, and Obsidian URI"
  - "UI frameworks in plugins: Vanilla DOM, React, Svelte, and Vue"
  - "Build toolchains, esbuild, Vite dual-target, hot-reload, and testing"
  - "Mobile compatibility, startup performance, and memory profiling"
  - "Security, XSS prevention, Sync storage limits, and network disclosure"
  - "Community Store submission, eslint-plugin review gates, BRAT, and release CI"
note_line_floor: 85
wikilink_target: 10
seed_gaps:
  - "Exact Obsidian 2026 Bases custom view registration signatures and API version gates require live verification against obsidian.d.ts"
  - "SecretStorage and OS keychain availability across desktop vs iOS and Android plugin sandboxes requires dated source verification"
  - "WebGPU availability vs WebGL2 fallback behavior across Electron Chromium versions shipped by current Obsidian desktop and mobile WebViews"
seed_questions:
  - "Which exact rules in obsidianmd/eslint-plugin cause automatic bot failures during Community Plugin Store pull requests in 2026?"
  - "When should an author build a native Bases custom view versus a standalone ItemView dashboard or Markdown codeblock processor?"
  - "What is the safest architecture for storing multi-megabyte vector or graph indexes without breaking Obsidian Sync or slowing vault startup?"
seed_experiments:
  - "Static analyzer verification probe against both clean and anti-pattern Obsidian plugin fixtures plus a real 3D ItemView plugin"
  - "Source-to-claim audit probe verifying every eslint-plugin and submission policy claim against live GitHub repository files"
  - "Three-mode rendering parity check comparing CodeMirror 6 ViewPlugin decorations against Reading view MarkdownPostProcessor lifecycle"
flow_playbooks:
  - "Claim Verification Flow"
  - "Explore Plan Code Commit"
  - "Multi-Agent Fan-Out Research Flow"
  - "Context Compaction Routine"
verification_modes:
  - "tool-result audit"
  - "fresh-context verifier"
  - "claim-ledger review"
eval_seed_count: 24
secretary_mode: "single"
curator_themes:
  - "architecture-and-views"
  - "editor-and-vault"
  - "security-mobile-and-release"
publish_surface: "sanitized-quartz"
public_exclude_patterns:
  - ".raw"
  - ".obsidian"
  - "home.md"
  - "activity.md"
  - "references/public-sources.json"
  - "references/public-sources.json"
public_content_policy: "publish summaries, links, and compliant short quotes only"
corpus_scope_policy: "each corpus note states harness, date, source, and non-scope"
context_budget_policy: "hot cache plus progress file plus just-in-time retrieval"
retrieval_pattern: "wiki plus hybrid search plus graph traversal"
provenance_trace_policy: "source to claim to note to decision to deliverable"
memory_governance_policy: "write, store, retrieve, execute, share, forget, rollback"
mutation_policy: "advisory-read-only-v1"
adapter_domain_depth: "schemas plus importers plus synthesis plus renderers plus fixtures plus tests"
live_api_spend_cap_usd: 0
answer_engine_policy: "useful crawlable primary-source passages, no GEO hacks"
substance_profile: "fable-grade"
uncertainty_eval_policy: "reward no data; penalize confident unsupported answers"
